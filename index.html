<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LongStudy</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Study Workspace</p>
          <h1>LongStudy</h1>
        </div>
      </header>

      <div class="app-body">
        <aside class="sidebar" aria-label="页面导航">
          <div class="sidebar-group">
            <p class="sidebar-label">Pages</p>
            <nav id="sidebar-nav" class="sidebar-nav"></nav>
          </div>
        </aside>

        <main class="content-panel">
          <div class="content-header">
            <div>
              <p class="content-label" id="content-label">Current View</p>
              <h2 id="content-title">主页</h2>
            </div>
          </div>

          <section id="home-view" class="home-view"></section>

          <div id="frame-shell" class="frame-shell hidden">
            <iframe
              id="content-frame"
              class="content-frame"
              title="Page Content"
              name="content-frame"></iframe>
          </div>
        </main>
      </div>
    </div>

    <script>
      const currentViewStorageKey = "longstudy:current-view";
      const pages = [
        {
          id: "brandon-task",
          title: "BrandonTask",
          file: "BrandonTask.html"
        }
      ];

      const views = [
        { id: "home", title: "主页", type: "home" },
        ...pages.map((page) => ({ ...page, type: "page" }))
      ];

      const sidebarNav = document.getElementById("sidebar-nav");
      const homeView = document.getElementById("home-view");
      const frameShell = document.getElementById("frame-shell");
      const contentFrame = document.getElementById("content-frame");
      const contentTitle = document.getElementById("content-title");
      const contentLabel = document.getElementById("content-label");

      function saveCurrentView(viewId) {
        localStorage.setItem(currentViewStorageKey, viewId);
      }

      function loadCurrentView() {
        const savedView = localStorage.getItem(currentViewStorageKey);
        if (views.some((view) => view.id === savedView)) {
          return savedView;
        }
        return "home";
      }

      function buildSidebar() {
        sidebarNav.innerHTML = "";
        views.forEach((view) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "nav-item";
          button.dataset.view = view.id;
          button.textContent = view.title;
          button.addEventListener("click", () => showView(view.id));
          sidebarNav.appendChild(button);
        });
      }

      function buildHomeCards() {
        const grid = document.createElement("div");
        grid.className = "page-grid";

        pages.forEach((page) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "page-card";
          card.innerHTML = `
            <span class="page-card-kicker">Subpage</span>
            <strong>${page.title}</strong>
          `;
          card.addEventListener("click", () => showView(page.id));
          grid.appendChild(card);
        });

        homeView.innerHTML = "";
        homeView.appendChild(grid);
      }

      function syncActiveNav(viewId) {
        sidebarNav.querySelectorAll(".nav-item").forEach((item) => {
          item.classList.toggle("active", item.dataset.view === viewId);
        });
      }

      function showView(viewId) {
        const view = views.find((entry) => entry.id === viewId) || views[0];
        syncActiveNav(view.id);
        saveCurrentView(view.id);

        if (view.type === "home") {
          contentLabel.textContent = "Current View";
          contentTitle.textContent = view.title;
          homeView.classList.remove("hidden");
          frameShell.classList.add("hidden");
          contentFrame.removeAttribute("src");
          return;
        }

        contentLabel.textContent = "Current Page";
        contentTitle.textContent = view.title;
        homeView.classList.add("hidden");
        frameShell.classList.remove("hidden");
        if (contentFrame.getAttribute("src") !== view.file) {
          contentFrame.setAttribute("src", view.file);
        }
      }

      buildSidebar();
      buildHomeCards();
      showView(loadCurrentView());
    </script>
  </body>
</html>
