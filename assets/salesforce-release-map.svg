<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Salesforce 2026 release map</title>
  <desc id="desc">A dashboard-style visual showing Salesforce clouds, Agentforce, Data 360, Slack, Tableau, and Flow connected as a 2026 release map.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8f6ff"/>
      <stop offset="0.45" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#0b5cab"/>
      <stop offset="1" stop-color="#00a1e0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#11395a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="680" fill="url(#sky)"/>
  <g opacity="0.55" fill="none" stroke="#b7d8ef" stroke-width="2">
    <path d="M90 128 C260 60, 380 188, 528 124 S840 96, 1080 160"/>
    <path d="M130 544 C306 440, 428 594, 602 506 S904 468, 1100 540"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="92" y="78" width="1016" height="524" rx="22" fill="#ffffff"/>
    <rect x="124" y="116" width="952" height="66" rx="16" fill="#f4f8fb"/>
    <circle cx="158" cy="149" r="13" fill="#ff6b6b"/>
    <circle cx="198" cy="149" r="13" fill="#ffc145"/>
    <circle cx="238" cy="149" r="13" fill="#2bb673"/>
    <rect x="292" y="134" width="320" height="16" rx="8" fill="#c8d8e6"/>
    <rect x="794" y="128" width="118" height="28" rx="14" fill="#dff3ff"/>
    <rect x="928" y="128" width="92" height="28" rx="14" fill="#e7f7eb"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(166 238)">
      <rect width="242" height="250" rx="18" fill="#eef8ff" stroke="#c7e4f6"/>
      <text x="28" y="48" font-size="25" font-weight="700" fill="#073b67">Agentforce</text>
      <text x="28" y="82" font-size="16" fill="#42677f">AI agents and orchestration</text>
      <rect x="28" y="118" width="176" height="16" rx="8" fill="#54bceb"/>
      <rect x="28" y="154" width="132" height="16" rx="8" fill="#93d5f5"/>
      <rect x="28" y="190" width="190" height="16" rx="8" fill="#b8e6fa"/>
    </g>
    <g transform="translate(478 210)">
      <rect width="246" height="306" rx="20" fill="url(#blue)"/>
      <text x="31" y="58" font-size="29" font-weight="700" fill="#fff">Salesforce</text>
      <text x="31" y="92" font-size="17" fill="#dff6ff">2026 Feature Map</text>
      <circle cx="80" cy="168" r="36" fill="#ffffff" opacity="0.28"/>
      <circle cx="134" cy="168" r="36" fill="#ffffff" opacity="0.18"/>
      <circle cx="188" cy="168" r="36" fill="#ffffff" opacity="0.28"/>
      <rect x="32" y="238" width="182" height="18" rx="9" fill="#ffffff" opacity="0.72"/>
    </g>
    <g transform="translate(792 238)">
      <rect width="242" height="250" rx="18" fill="#f0fbf5" stroke="#cbead6"/>
      <text x="28" y="48" font-size="25" font-weight="700" fill="#174b2d">Data 360</text>
      <text x="28" y="82" font-size="16" fill="#4d705b">Trusted data and analytics</text>
      <rect x="28" y="118" width="186" height="16" rx="8" fill="#39b56a"/>
      <rect x="28" y="154" width="150" height="16" rx="8" fill="#7ed99b"/>
      <rect x="28" y="190" width="198" height="16" rx="8" fill="#b7edc7"/>
    </g>
    <g fill="#406075" font-size="15" font-weight="700">
      <text x="310" y="554">Slack-first workflows</text>
      <text x="520" y="554">Flow and automation</text>
      <text x="760" y="554">Tableau insights</text>
    </g>
  </g>
  <g fill="none" stroke="#7dbedf" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M408 348 C438 308, 450 300, 478 336"/>
    <path d="M724 336 C754 302, 770 306, 792 348"/>
  </g>
</svg>
